  # ============================================================================
  # Execution
  # ============================================================================
  /call/{owner}/{project}:
    post:
      tags: [Execution]
      operationId: callProject
      summary: Run a project, or a connector
      description: |
        One route for every project. A **connector** is an ordinary project we
        curated and priced; what being one adds is decided from the project id,
        not from the way in.

        A connector call MUST name its operation as a top-level `operation`
        string inside `input`. The same bytes are read by four parties — the
        contract prices the call, the coordinator bills it, the worker refuses
        to run without it, and the guest dispatches on it — so there is one
        value and nothing to keep in step. Absent, blank, non-string, nested, or
        spelled `op` are all refused before anything runs, and an operation with
        no on-chain price is refused too: unpriced is not free.

        **Waiting.** Synchronous by default: the connection is held until the
        run finishes or the server's window elapses. Send `"async": true` for
        anything longer — it returns at once with `call_id` and `poll_url`, and
        that path has no window at all. A synchronous call that outruns the
        window is settled, not suspended: `408`, charged for the compute
        authorised and never for the operation. Do not retry it — the original
        may still be running and will be charged.
      security:
        - PaymentKeyAuth: []
      parameters:
        - name: owner
          in: path
          required: true
          schema: { type: string }
          description: Project owner account, e.g. `connectors.outlayer.near`.
        - name: project
          in: path
          required: true
          schema: { type: string }
        - name: X-Use-Owner-Secret
          in: header
          required: false
          schema: { type: string, enum: ['1', 'true'] }
          description: |
            Fetch the secret stored for this agent and inject it into the run.
            Nothing is looked up unless the call asks. Only meaningful for a key
            owned by a custody wallet; an ordinary payment key addresses its own
            secrets through the body.
        - name: X-Attached-Deposit
          in: header
          required: false
          schema: { type: string }
          description: Stablecoin minimal units paid to the project's owner. Refused for connectors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCallRequest'
      responses:
        '200':
          description: The run finished, or was accepted for polling when `async`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCallResponse'
        '402':
          description: The key cannot pay for this call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallRefusal'
        '403':
          description: The key's scope does not include this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallRefusal'
        '408':
          description: |
            The call did not finish inside the synchronous window and has been
            settled as failed. Terminal — send it as `async` and poll instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallTimedOut'
        '409':
          description: |
            `no_bound_identity` — the call asked to run as a bound account with
            `use_bound_identity`, and there is none to run as: either the paying
            key names no wallet (`terminal: true`), or the wallet has no ACTIVE
            binding (`terminal: false` — a pending or revoked binding authorizes
            nothing, and one that activates later makes the same call work).

            Refused before the call is priced or charged, and never answered by
            running the job under the caller's own name: which account the guest
            IS decides what a connector does with it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallRefusal'
        '503':
          description: |
            `upstream_unavailable` — something this call depends on has not
            caught up yet, and the same call works later. `keystore_error` —
            the TEE keystore was unreachable or refused to sign. Both are
            transient and both are sent with a `Retry-After` interval.

            Deliberately not `service_unavailable`: on `/wallet/v1/*` that code
            means a feature this deployment does not offer and carries no
            interval, and one product must not use one code for "come back" and
            "never come back".
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallRefusal'
        '429':
          description: |
            Three different refusals share this status, and a caller tells them
            apart by `reason` rather than by the code:

            * `call_already_in_flight` — an ALLOWANCE runs one call at a time.
              **`terminal: false`**: it clears by itself when the call in flight
              finishes, so the move is to wait, or to fund the key (money is not
              limited this way, and a funded key answers both at once);
            * `connector_quota_exceeded` — the wallet's daily connector quota,
              which widens with the wallet's age and is independent of paying;
            * a plain rate limit, with no `reason`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  reason:
                    type: string
                    enum: [call_already_in_flight, connector_quota_exceeded]
                  terminal:
                    type: boolean
                    description: False means waiting clears it; true means it will not.
                  used: { type: integer }
                  limit: { type: integer }
        '401':
          description: >
            No payment credential, or one that cannot pay. `reason` tells the two
            apart: `missing_payment_key` for a caller that sent nothing, and
            `wk_is_not_a_payer` for one that sent a `wk_` — that credential names a
            wallet on /wallet/v1/*, it does not buy anything here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallRefusal'

  /calls/{call_id}:
    get:
      tags: [Execution]
      operationId: getCallResult
      summary: Poll an asynchronous call
      security:
        - PaymentKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: call_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The call's current state. `status` is `pending` until it settles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCallResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # Payment keys and subscriptions
  # ============================================================================
  /wallet/v1/create-payment-key:
    post:
      tags: [Subscriptions]
      operationId: createPaymentKey
      summary: Create a payment key for this wallet
      description: |
        Two transactions on chain: the key's secret is stored, then funded. An
        **agent** key is keyless — it is named after the wallet itself, so the
        response carries no `payment_key` to hand out, and a wallet may have
        exactly one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentKeyRequest'
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentKeyResponse'
        '400':
          description: The amount is not one an account can hold.
        '402':
          description: |
            The wallet holds less than the deposit asks for. The message names
            what it holds, what is needed, and where to send it.
        '503':
          description: |
            The wallet's balance could not be read, so nothing was attempted and
            nothing was charged. Transient — retry.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wallet/v1/subscription/purchase-info:
    get:
      tags: [Subscriptions]
      operationId: subscriptionPurchaseInfo
      summary: What is on sale, and what this wallet needs to buy it
      responses:
        '200':
          description: |
            The plans on chain joined with their terms. An empty list means one
            half is missing — a plan is sellable only when both exist.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscription/status:
    get:
      tags: [Subscriptions]
      operationId: subscriptionStatus
      summary: A key's allowance, balance, and the connectors in its scope
      security:
        - PaymentKeyAuth: []
      responses:
        '200':
          description: |
            `allowance_*` describe a subscription; `balance` and `withdrawable`
            describe money. A call covered by an allowance costs the caller
            nothing at the moment of the call — and pays the connector's author
            nothing either.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatus'
        '401':
          description: |
            No credential, or — with a `wk_` — a wallet that has no agent key
            yet, which answers `Missing X-Payment-Key header`. That is the reply
            to "which key of yours should I report on", not a rejected `wk_`:
            create the agent key with `create-payment-key {"agent": true}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /subscription/purchase:
    post:
      tags: [Subscriptions]
      operationId: purchaseAllowance
      summary: Turn balance already on a key into allowance
      description: |
        Buys a plan out of the key's own balance. Needs a key STRING, so it is
        for ordinary payment keys: an agent's key has none — it is named after
        the wallet — and an agent's subscription is bought on chain instead,
        with an `ft_transfer_call` carrying
        `{"action":"buy_subscription","nonce":N,"owner":"<agent>","plan":0}`.

        Only the plan's PRICE is spent; an overpayment stays on the key as
        balance. The allowance ADDS to whatever is there and validity extends
        from `max(now, expires_at)`, so buying again never shortens what is
        already paid for.

        A `wk_` is deliberately NOT accepted here: it is a read credential, and
        spending on the owner's behalf is not something a compromised agent
        should be able to do.
      security:
        - PaymentKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_usd]
              properties:
                amount_usd:
                  type: string
                  description: |
                    Stablecoin minimal units, as an integer string. `10000000`
                    is $10.00.
                plan:
                  type: integer
                  description: |
                    Which plan, by index — the same identifier an on-chain
                    purchase names. Absent means the cheapest on sale. A payment
                    short of the named plan buys the best plan it does cover.
      responses:
        '200':
          description: The plan sold, which is not always the one asked for.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: { type: string }
                  allowance_purchased_usd: { type: string }
                  allowance_total_usd: { type: string }
                  spent_usd:
                    type: string
                    description: The PLAN'S price, not the whole `amount_usd`.
                  expires_at: { type: string }
                  days_added: { type: integer }
        '402':
          description: The key's balance does not cover the cheapest plan on sale.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscription/notifications:
    put:
      tags: [Subscriptions]
      operationId: setSubscriptionNotifications
      summary: Where to warn the owner about the allowance and the expiry
      description: |
        Either channel, or both; `null` clears one. Never defaulted to an
        address the owner did not choose — a warning nobody reads is worse than
        no warning.

        PERSONAL DATA: the address is stored against the key.
      security:
        - PaymentKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: [string, 'null'] }
                webhook_url: { type: [string, 'null'] }
      responses:
        '200':
          description: What is stored now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: [string, 'null'] }
                  webhook_url: { type: [string, 'null'] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trial-key:
    post:
      tags: [Subscriptions]
      operationId: claimTrialKey
      summary: Claim this wallet's one trial key
      description: |
        A real payment key, granted rather than sold, and spent exactly like any
        other — same header, same balance endpoint, same refusals.

        What makes it a trial: its value is an ALLOWANCE (never withdrawable, it
        ends at its expiry), it is a GRANT (it cannot pay a developer through
        `X-Attached-Deposit`), and it is SCOPED to the curated connector
        namespace, so it cannot run arbitrary code at our expense. It carries no
        wallet, so a trial call gets no custody host functions.

        One per wallet, claimable within a window after the wallet is created;
        the window, the days and the allowance are operator settings, and the
        answer states the ones it granted. There is also a per-IP cap.

        **The key string is shown once and cannot be re-issued.**
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The claimed key and its terms.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_key:
                    type: string
                    description: The whole `X-Payment-Key` header value. Shown once.
                  owner: { type: string }
                  nonce: { type: integer }
                  allowance_usd: { type: string }
                  days: { type: integer }
                  project_ids:
                    type: array
                    items: { type: string }
                    description: Anything else is refused as `project_not_allowed`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Already claimed, or claimed too late for this wallet's age.

  /public/payment-keys/{owner}/{nonce}/balance:
    get:
      tags: [Subscriptions]
      operationId: publicPaymentKeyBalance
      summary: What a key has spent and what is left, without presenting it
      description: |
        Addressed by owner and nonce rather than by the key itself, so a
        dashboard can show a key's balance without holding its string. It
        reports MONEY only — allowance and expiry need the key, through
        `/subscription/status`.
      security: []
      parameters:
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: nonce
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Money on the key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner: { type: string }
                  nonce: { type: integer }
                  initial_balance: { type: string }
                  spent: { type: string }
                  reserved: { type: string }
                  available: { type: string }
                  last_used_at: { type: [string, 'null'] }
        '404':
          description: No such key.

  # ============================================================================
  # A secret left for an agent
  # ============================================================================
  /wallet/v1/agent-secret/pubkey:
    get:
      tags: [Subscriptions]
      operationId: agentSecretPubkey
      summary: The key to seal a secret for this agent
      description: |
        Encrypt on your own machine and send back only ciphertext — the
        credential never exists in this process. The answer names the seed and
        the agent so a mismatch is visible rather than silent.

        Give exactly ONE of `project_id` and `wasm_hash`. A project secret is
        readable by every version of that project; a `wasm_hash` secret is
        readable only by that exact build, and a rebuild that changes a byte
        cannot open it. They seal to different seeds, so the choice made here
        must be the one made when storing.
      parameters:
        - name: project_id
          in: query
          required: false
          schema: { type: string }
        - name: wasm_hash
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: X25519 public key (hex), encrypt-only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSecretPubkey'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wallet/v1/agent-secret:
    post:
      tags: [Subscriptions]
      operationId: storeAgentSecret
      summary: Store a secret for this agent, the agent's wallet paying
      description: |
        The agent's own wallet signs and stakes the storage, so it needs about
        0.11 NEAR. With none, the answer says so and names the endpoint that
        pays instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [encrypted_secrets_base64]
              properties:
                project_id:
                  type: string
                  description: Exactly one of this and `wasm_hash`.
                wasm_hash:
                  type: string
                  description: One exact build instead of a project.
                encrypted_secrets_base64:
                  type: string
                  description: Sealed to the key from `/agent-secret/pubkey`. Never a plaintext secret.
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tx_hash: { type: string }
                  agent_account: { type: string }
        '402':
          description: The agent's wallet cannot pay the storage deposit.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wallet/v1/agent-secret/prepare:
    post:
      tags: [Subscriptions]
      operationId: prepareAgentSecret
      summary: The same store, as a call for the payer to send
      description: |
        The keystore only signs; the call comes back for `payer` to send from
        their own account, so the agent's wallet needs no NEAR at all. The
        signature binds every argument that decides what is stored, who may read
        it and who pays — including the payer, so handing the prepared call to
        somebody else is a refusal rather than a shortcut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [encrypted_secrets_base64, payer]
              properties:
                project_id:
                  type: string
                  description: Exactly one of this and `wasm_hash`.
                wasm_hash:
                  type: string
                  description: One exact build instead of a project.
                encrypted_secrets_base64: { type: string }
                payer:
                  type: string
                  description: The account that will send the transaction and stake the storage.
      responses:
        '200':
          description: A `store_agent_secret` call, complete with the wallet's signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedAgentSecret'
        '503':
          description: |
            The ciphertext did not decrypt under this agent's seed, so nothing
            was signed. Encrypt with the key from `/agent-secret/pubkey` for
            this exact project.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wallet/v1/agent-secret/delete/prepare:
    post:
      tags: [Subscriptions]
      operationId: prepareAgentSecretDelete
      summary: Remove the agent's secret, as a call for the payer to send
      description: |
        The mirror of `/agent-secret/prepare`: the keystore signs, `payer` sends
        the call from their own account, and the storage deposit goes back to
        whoever sends it. The agent needs no NEAR to be forgotten.

        Authority is the `wk_`, not the NEAR account paying. The agent's key
        never moves — it IS the agent's account — so a rotated credential still
        speaks for the agent, and a wallet whose seed is lost cannot delete its
        secrets at all.

        Signed under its OWN domain, so a signature obtained to store a secret
        cannot be presented to destroy one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payer]
              properties:
                project_id:
                  type: string
                  description: Exactly one of this and `wasm_hash`.
                wasm_hash:
                  type: string
                  description: One exact build instead of a project.
                payer:
                  type: string
                  description: |
                    The account that will send the transaction, and the one the
                    storage deposit returns to.
      responses:
        '200':
          description: |
            A `delete_agent_secret` call, complete with the wallet's signature.
            No deposit field: the method is not payable, and attaching anything
            is refused before the contract sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedAgentSecretDelete'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

# ==============================================================================
# Components
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: wk_<32-hex-chars>
      description: |
        API key returned by `POST /register`. Format `wk_<hex>`. Pass as
        `Authorization: Bearer wk_...`.
    PaymentKeyAuth:
      type: apiKey
      in: header
      name: X-Payment-Key
      description: |
        A payment key, `{owner}:{nonce}:{secret}`. Created by
        `POST /wallet/v1/create-payment-key` and funded on chain. An AGENT key
        has no secret to present — it is named after its wallet, and that
        wallet's `Authorization: Bearer wk_...` stands for it.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: |
        Optional idempotency token. Resubmitting a write request with the same
        key returns the original result without re-execution. Recommended for
        clients that retry on network failure.

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            bad_request:
              value: { error: bad_request, message: "amount must be positive" }
            invalid_address:
              value: { error: invalid_address }
            unsupported_chain:
              value: { error: unsupported_chain }
            unsupported_token:
              value: { error: unsupported_token }
            insufficient_balance:
              value: { error: insufficient_balance }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_auth:
              value: { error: missing_auth }
            invalid_api_key:
              value: { error: invalid_api_key }
            timestamp_expired:
              value: { error: timestamp_expired }
    Forbidden:
      description: Action blocked by policy or wallet state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            policy_denied:
              value: { error: policy_denied, message: "daily limit exceeded" }
            wallet_frozen:
              value: { error: wallet_frozen }
            not_approver:
              value: { error: not_approver }
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            request_not_found:
              value: { error: request_not_found }
            approval_not_found:
              value: { error: approval_not_found }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limited:
              value: { error: rate_limited }
    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal_error:
              value: { error: internal_error }
    ServiceUnavailable:
      description: >-
        Unavailable — either permanently on this deployment or transiently, and
        the code says which. `service_unavailable`: feature not
        enabled/configured (e.g. the `/wallet/v1/confidential/*` routes when
        `ENABLE_CONFIDENTIAL_INTENTS` is off, the binding-event endpoints
        without a webhook secret, or NEAR Intents on a network with no solvers)
        — do not retry; no interval is sent because none would be true.
        `chain_unavailable`: the chain, or a node in front of it, could not
        answer this second — a balance that could not be read, a code hash that
        could not be fetched, a binding that could not be verified, a
        transaction that expired against a block the node has forgotten.
        Nothing happened and nothing was charged — transient, retry after the
        `Retry-After` header. `keystore_error`: the TEE keystore (signing / key
        derivation) was unreachable or rejected the request — transient, retry
        after `Retry-After`. `confidential_jwt_expired`: the confidential
        per-account JWT was rejected by the 1Click upstream and
        re-authentication also failed — transient, retry after `Retry-After`.
        (Transient upstream failures use 503 rather than 502 because
        Cloudflare replaces origin 502/504 responses with its own HTML error
        page, hiding the JSON body from clients.)
      headers:
        Retry-After:
          description: >-
            Present on transient failures (`chain_unavailable`,
            `keystore_error`, `confidential_jwt_expired`) — seconds to wait
            before retrying. Absent on `service_unavailable`, which is not
            transient: there is no interval after which an unset environment
            variable becomes set.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            service_unavailable:
              value:
                error: service_unavailable
                message: Confidential intents are not configured on this deployment
            keystore_error:
              value: { error: keystore_error }
            confidential_jwt_expired:
              value: { error: confidential_jwt_expired }
    OnChainTxFailed:
      description: >-
        The transaction was signed and broadcast — the network accepted it —
        but its on-chain execution REVERTED. `tx_hash` is real (the tx is on
        chain); no state-changing effect happened. Do NOT retry:
        re-broadcasting duplicates an already-recorded transaction and burns
        gas again. `message` is the decoded FunctionCallError / panic string,
        `failure` the raw NEAR execution-failure JSON. (422 rather than 502
        because Cloudflare replaces origin 502/504 responses with its own HTML
        error page, which would hide this body from clients.)
        Scope: synchronous execution only. When the operation goes through the
        multisig approval flow instead, execution happens in the background
        after the threshold is met — a revert there surfaces as
        `status: "failed"` via `GET /wallet/v1/requests/{request_id}` and the
        `request_completed` webhook, never as a synchronous 422.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OnChainTxFailedError'
          examples:
            onchain_tx_failed:
              value:
                error: onchain_tx_failed
                message: 'Exceeded the prepaid gas.'
                tx_hash: 8YyQnDxNSgrtZtAhDwHRfcpyTAcqGJ4kdmSf7eVLh2dG
                failure:
                  ActionError:
                    index: 0
                    kind:
                      FunctionCallError:
                        ExecutionError: 'Exceeded the prepaid gas.'

  schemas:
    # ----- Execution -----
    ProjectCallRequest:
      type: object
      required: [input]
      properties:
        input:
          type: object
          description: |
            The project's own input. A CONNECTOR additionally requires a
            top-level `operation` string here — the one field every connector
            uses, read by the contract, the coordinator, the worker and the
            guest alike.
          properties:
            operation:
              type: string
              description: Required for connectors. `op` is not accepted.
        async:
          type: boolean
          default: false
          description: |
            Return at once with `call_id` and `poll_url` instead of holding the
            connection. No window applies on this path — long work belongs here.
        version_key:
          type: string
          description: Pin a specific published version instead of the active one.
        use_bound_identity:
          type: boolean
          default: false
          description: |
            Agent Connect: run under the BOUND asset account's name, so the
            guest's `NEAR_SENDER_ID` becomes e.g. `agent.tla` instead of the
            wallet's own account. near-email turns that into the mailbox it
            sends from, and other connectors derive keys and state from it.

            Opt-in, and off by default on purpose. A binding is a capability
            the agent gains, not a change to who it already is — renaming the
            guest the moment one activated would move every derived identity
            with nothing in your code to point at.

            Requires an ACTIVE binding, and says so rather than falling back:
            with no binding — or with one still pending, or revoked — the call
            is refused `409 no_bound_identity` before it is priced or charged.
            The worker then re-verifies the claim against the chain inside the
            TEE and refuses the job if the chain disagrees. Billing never
            follows the name: `NEAR_USER_ACCOUNT_ID` stays the paying key's
            owner.
        secrets_ref:
          type: object
          properties:
            profile: { type: string }
            account_id: { type: string }
    ProjectCallResponse:
      type: object
      properties:
        call_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, completed, failed]
        output: { type: [object, 'null'] }
        error: { type: [string, 'null'] }
        compute_cost:
          type: [string, 'null']
          description: Stablecoin minimal units, compute only — the operation's fee is separate.
        instructions: { type: [integer, 'null'] }
        time_ms: { type: [integer, 'null'] }
        poll_url:
          type: [string, 'null']
          description: Present when the call was accepted for polling.
        attestation_url:
          type: [string, 'null']
          description: The TEE quote for this execution.
    CallRefusal:
      type: object
      description: >
        Every refusal from `POST /call/{owner}/{project}`. `error` is a sentence
        written for a person and is reworded freely; `reason` is the contract —
        branch on it. The enum is generated from `CallError::reason()` in the
        coordinator and is exhaustive there, so a value outside it means the
        client is older than the server.
      properties:
        error: { type: string, description: The human sentence. }
        terminal:
          type: boolean
          description: >
            Present on the refusals where retrying has an answer. `true` means
            the same request can never succeed; `false` means it succeeds once
            something changes that the caller or the wallet's owner can change.
            `no_bound_identity` sends both: `true` when the paying key names no
            wallet at all, `false` when the wallet simply has no ACTIVE binding
            yet.

            `upstream_unavailable` (503 + `Retry-After`) is this door's
            transient answer — something we depend on has not caught up and the
            same call works later. It is deliberately NOT called
            `service_unavailable`: on `/wallet/v1/*` that code means a feature
            this deployment does not offer and must not be retried, and a
            client's retry rule is written once for every answer.
        reason:
          type: string
          description: Machine-readable name of the refusal.
          enum: [allowance_no_deposit, bad_key_format, compute_limit_too_low, connector_quota_exceeded, expires_too_soon, insufficient_allowance, insufficient_balance, internal_error, invalid_key, keystore_error, max_per_call_exceeded, missing_payment_key, no_bound_identity, no_deposit, operation_limit_reached, out_of_funds, project_not_allowed, project_not_found, rate_limit_exceeded, upstream_unavailable, tee_session_required, timeout, too_many_concurrent_calls, unknown_operation, vault_not_verified, vault_unlocked, wallet_not_yours, wk_is_not_a_payer]
      required: [error, reason]
    CallTimedOut:
      type: object
      properties:
        error: { type: string }
        reason: { type: string, enum: [timeout] }
        call_id: { type: string, format: uuid }
        poll_url: { type: string }
    # ----- Payment keys and subscriptions -----
    CreatePaymentKeyRequest:
      type: object
      properties:
        initial_deposit_usdc:
          type: string
          description: Dollars, e.g. `"1.00"`. Mutually exclusive with `initial_deposit_near`.
        initial_deposit_near:
          type: string
          description: |
            NEAR, swapped to the stablecoin through Intents — mainnet only.
        project_ids:
          type: array
          items: { type: string }
          description: |
            The scope, fixed at creation. `owner/*` allows a whole namespace.
        max_per_call:
          type: string
          description: Dollars. `"0"` or absent means no limit.
    CreatePaymentKeyResponse:
      type: object
      properties:
        nonce: { type: integer }
        owner: { type: string }
        payment_key:
          type: string
          description: |
            Shown once. Store it: a call presents it as `X-Payment-Key`, and it
            cannot be re-issued.
        store_secrets_tx: { type: string }
        top_up_tx: { type: [string, 'null'] }
    SubscriptionStatus:
      type: object
      properties:
        owner: { type: string }
        nonce: { type: integer }
        has_subscription: { type: boolean }
        wallet_account:
          type: string
          description: |
            The custody wallet this key belongs to, when it belongs to one.
            Absent for a key owned by a named account. Read from the key's
            `owner`.
        expires_at: { type: [string, 'null'] }
        expired: { type: boolean }
        allowance_total_usd: { type: [string, 'null'] }
        allowance_spent_usd: { type: [string, 'null'] }
        allowance_available_usd: { type: [string, 'null'] }
        balance:
          type: string
          description: Money on the key. Nets out anything currently reserved by a call in flight.
        withdrawable: { type: string }
        connector_namespace: { type: string }
        connectors:
          type: array
          items:
            type: object
            properties:
              connector_id: { type: string }
              name: { type: string }
              endpoint: { type: string }
              project_id: { type: string }
              operations:
                type: array
                items:
                  type: object
                  properties:
                    operation: { type: string }
                    price_usd: { type: string }
        connectors_in_scope: { type: boolean }
    AgentSecretPubkey:
      type: object
      properties:
        pubkey:
          type: string
          description: X25519 public key, hex. Encrypt-only.
        seed:
          type: string
          description: |
            `project:{project_id}:{agent_account}` — returned so a mismatch is
            visible rather than silent.
        agent_account:
          type: string
          description: The secret's name AND its owner.
    PreparedAgentSecret:
      type: object
      properties:
        contract_id: { type: string }
        method_name: { type: string, enum: [store_agent_secret] }
        args:
          type: object
          description: Complete arguments, including the agent wallet's signature.
        deposit: { type: string, description: yoctoNEAR; the contract refunds the excess. }
        gas: { type: string }
        agent_account: { type: string }
    PreparedAgentSecretDelete:
      type: object
      properties:
        contract_id: { type: string }
        method_name: { type: string, enum: [delete_agent_secret] }
        args:
          type: object
          description: Complete arguments, including the agent wallet's signature.
        gas: { type: string }
        agent_account: { type: string }
    # ----- Primitives -----
    Chain:
      type: string
      enum: [near, ethereum, polygon, base, arbitrum, optimism, bsc, avalanche, solana, bitcoin]
      description: >-
        Supported chain identifier. The EVM chains (ethereum, polygon, base,
        arbitrum, optimism, bsc, avalanche) all share ONE derived address (a
        single secp256k1 key) and are signable via `/wallet/v1/evm/*`.
        `solana` has its own derived ed25519 address and is signable via
        `/wallet/v1/solana/*`. `bitcoin` can be derived in the keystore but is
        not yet serviced by wallet v1.

    RequestType:
      type: string
      description: |
        Tracked async request / policy transaction type. `withdraw` is a
        same-chain intents withdrawal; `cross_chain_withdraw` is a separate type
        for 1Click bridge-out (a policy must list it explicitly — it is NOT
        folded into `withdraw`). `confidential` covers every confidential-shard
        op (shield / unshield / withdraw / transfer / swap). The deposit family
        (`intents/deposit`, `storage-deposit`, cross-chain deposit) all gate as
        `call`.
      enum:
        - call
        - transfer
        - withdraw
        - cross_chain_withdraw
        - deposit
        - swap
        - confidential

    RequestStatus:
      type: string
      description: >-
        `partially_failed` occurs only for `w_execute_extension` (Agent
        Connect's extension door) and is a NORMAL outcome, not an error: the
        wallet detaches its promises, they execute concurrently and
        independently, and one failing neither reverts the others nor undoes
        the value they moved. Read `result.promises[]` for which did what.
      enum:
        - pending_deposit
        - processing
        - success
        - partially_failed
        - failed
        - refunded
        - pending_approval
        - approved
        - rejected
        - cancelled
        - needs_review

    ErrorCode:
      type: string
      enum:
        - missing_auth
        - invalid_api_key
        - missing_wallet_id
        - invalid_wallet_id
        - missing_signature
        - invalid_signature
        - missing_timestamp
        - timestamp_expired
        - wallet_frozen
        - policy_denied
        - not_approver
        - insufficient_balance
        # 402, and about the SIGNER rather than the request: the account that
        # would send the transaction cannot pay for it. `wallet_underfunded`
        # names the wallet's own NEAR account and what the call costs;
        # `vault_underfunded` is the same shortfall on a vault. Actionable and
        # permanent until somebody sends funds — not something to retry on a
        # timer.
        - wallet_underfunded
        - vault_underfunded
        - invalid_address
        - rate_limited
        - unsupported_chain
        - unsupported_token
        - request_not_found
        - approval_not_found
        - already_approved
        - bad_request
        - conflict
        - duplicate_idempotency_key
        - onchain_tx_failed
        - internal_error
        - keystore_error
        - service_unavailable
        # Same status as `service_unavailable`, opposite instruction: this one
        # clears by itself and carries a Retry-After. They were one code once,
        # and the header could then only be right for one of them.
        - chain_unavailable
        # 422, and the OPPOSITE instruction to `chain_unavailable` above. The
        # chain ANSWERED, and the answer was about the account asked rather than
        # a value: no such account, no contract code, no such method, or code
        # that panicked. No number of retries changes that, so no Retry-After is
        # sent. A balance route answers this rather than a figure: a contract
        # that cannot say what an account holds has not said it holds nothing.
        - chain_refused
        # The node's own validation refused to admit the transaction — expired,
        # bad nonce, unknown signer. Nothing executed and nothing was charged.
        - tx_rejected_by_node
        - confidential_jwt_expired
        # Agent Connect. The bodies for these two carry MORE than the uniform
        # {error, message} shape — see AgentConnectDeniedResponse and
        # WalletBusyResponse — and a client that only switches on the code
        # throws away the fields that tell it what to do next.
        - agent_connect_denied
        - wallet_busy
        - binding_not_found

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: object
          additionalProperties: {}

    OnChainTxFailedError:
      type: object
      required: [error, tx_hash]
      description: |
        Body of the 422 `onchain_tx_failed` response. Unlike `ErrorResponse`,
        it carries the real `tx_hash` (the transaction IS on chain) and the raw
        NEAR execution-failure JSON.
      properties:
        error:
          type: string
          const: onchain_tx_failed
        message:
          type: string
          description: Decoded FunctionCallError / contract panic string.
        tx_hash:
          type: string
          description: Hash of the broadcast transaction. Real — the tx is on chain.
        failure:
          description: Raw NEAR execution-failure JSON (e.g. `ActionError`).

    # ----- Registration -----
    RegisterRequest:
      type: object
      description: |
        For the common case (anonymous wallet on OutLayer's shared master),
        send empty `{}`. Optional fields enable advanced flows:

        - `vault_id`: bind this wallet to an existing customer-owned vault,
          so the wallet's master is derived through the vault's per-customer
          MPC-derived master instead of OutLayer's shared default. The vault
          must already be deployed and verified — **vault deployment is not
          done through this endpoint**. Use the dashboard
          (https://outlayer.fastnear.com/vault) or the CLI
          (`outlayer vault init`) to deploy. Reference:
          https://outlayer.fastnear.com/docs/vaults
        - `account_id` + `pubkey` + `message` + `signature`: bind the wallet
          to a verified NEAR account via NEP-413 proof-of-ownership. Used
          by clients that want operational keys (`wk_...`) tied to a real
          NEAR account.
      properties:
        account_id:
          type: string
          description: NEAR account ID to bind the wallet to (requires NEP-413 signature).
        seed:
          type: string
          description: Reserved for deterministic-wallet derivation. Most callers leave unset.
        pubkey:
          type: string
          description: NEP-413 signer pubkey (paired with `account_id` + `signature`).
        message:
          type: string
          description: NEP-413 message that was signed.
        signature:
          type: string
          description: NEP-413 signature over `message`.
        vault_id:
          type: string
          description: |
            ID of a deployed and verified customer vault (e.g. `vault.alice.near`).
            Binding is permanent — the resulting API key is tied to this vault
            for its lifetime. All subsequent operations on the API key
            automatically derive keys through the per-vault master; you do
            NOT pass `vault_id` on every call.

    RegisterResponse:
      type: object
      required: [wallet_id, near_account_id]
      properties:
        wallet_id:
          type: string
          format: uuid
        api_key:
          type: string
          description: Shown once. Not retrievable later — save it now.
        near_account_id:
          type: string
        handoff_url:
          type: string
          format: uri
          description: Dashboard URL where the controller sets policy.
        trial:
          $ref: '#/components/schemas/TrialInfo'

    TrialInfo:
      type: object
      properties:
        calls_remaining:
          type: integer
        expires_at:
          type: string
          format: date-time
        limits:
          type: object
          properties:
            max_instructions:
              type: integer
            max_execution_seconds:
              type: integer
            max_memory_mb:
              type: integer

    # ----- Wallet read -----
    AddressResponse:
      type: object
      required: [wallet_id, chain, address, public_key]
      properties:
        wallet_id:
          type: string
        chain:
          $ref: '#/components/schemas/Chain'
        address:
          type: string
        public_key:
          type: string
        vault_id:
          type: [string, 'null']
        asset_account_id:
          type: [string, 'null']
          description: >-
            Agent Connect: the bound named asset account. Always present for
            chain=near and `null` when the wallet has no binding — a key that
            is simply absent is a different answer to a client that checks for
            one.
        executor_account_id:
          type: [string, 'null']
          description: >-
            Agent Connect: the executor identity. For chain=near always equal
            to `address`.
        gas_balance:
          type: [string, 'null']
          description: >-
            Agent Connect: the executor's native balance in yoctoNEAR, cached
            about 30 seconds. Present only for chain=near on a BOUND wallet —
            it is here so whoever funds the executor learns the account and
            whether it needs funding in one call. Absent also when the chain
            could not be read, which is not a balance of zero.

    BalanceResponse:
      type: object
      required: [balance, token, account_id, account]
      properties:
        balance:
          type: string
          description: Amount in token's smallest unit.
        token:
          type: string
        account_id:
          type: string
        account:
          type: string
          enum: [asset, executor]
          description: >-
            Which identity `account_id` is, so the figure cannot be
            misattributed. `executor` for every wallet without a binding.

    WalletBusyResponse:
      type: object
      description: >-
        A `409` meaning another money-moving operation is using this wallet.


        A wallet runs one spend at a time. The check "does this fit the limit?"
        and the write that satisfies it are seconds apart, so two overlapping
        operations would both read a total that neither had written yet and
        both pass — spending a daily cap twice. Serializing per wallet is what
        makes the counters true, and it cannot be done in SQL instead: the
        limits live in the customer's encrypted policy, which only the enclave
        can read.


        Callers wait a short grace first, so two quick calls in a row simply
        queue and never see this. It appears when the operation in front is a
        long one — a swap or a cross-chain withdraw. Poll
        `in_flight_request_id` when it is set, rather than retrying blindly;
        when it is `null`, `in_flight_operation` still says what to wait for.
      required: [error, message]
      properties:
        error:
          type: string
          enum: [wallet_busy]
        message:
          type: string
        in_flight_request_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The request holding the wallet, and only ever one that
            `GET /wallet/v1/requests/{request_id}` can already answer. `null`
            never means the wallet is free: it means there is nothing to poll,
            and `message` says which of the two reasons applies — the holder
            has not written its request row yet (retrying shortly yields an
            id), or the operation writes no request row at all, as a
            cross-chain deposit intent does. An id is deliberately withheld
            until its row exists, because one handed out earlier answers `404`
            and reads as a request that was lost.
        in_flight_operation:
          type: [string, 'null']
          description: >-
            What the holder is doing. Present even when
            `in_flight_request_id` is `null`, and worth branching on: a
            transfer clears in seconds while a cross-chain withdraw can run for
            many minutes, and that is the difference between retrying at once
            and backing off. `repair` is the odd one — a read of a request left
            unresolved settles it under the same lock, and that finishes
            quickly.
          enum:
            # `null` belongs in the list because the field is nullable: the
            # coordinator answers `busy` without an operation in the sliver
            # between a holder taking the wallet and announcing itself. An enum
            # that omits it would declare that moment impossible.
            - null
            - transfer
            - call
            - swap
            - delete
            - withdraw
            - cross_chain_withdraw
            - cross_chain_deposit
            - storage_deposit
            - intents_transfer
            - intents_deposit
            - confidential
            - confidential_deposit
            - repair

    AgentConnectDeniedResponse:
      type: object
      description: >-
        A `403` from the Agent Connect pre-flight: the request was refused
        BEFORE it was signed, so no gas was spent, and the refusal names the
        rule the wallet contract would have panicked on.


        Structured rather than prose because a client has to route on it. Read
        `terminal` first: `true` means retrying is pointless and the OWNER must
        act — issue a new grant, re-provision the executor, fund the account,
        or rewrite the request. `false` means the same request may succeed
        later with nothing changed (a freeze lifted, a parked account
        reactivated, recognized wallet code restored).
      required: [error, message, class, terminal]
      properties:
        error:
          type: string
          enum: [agent_connect_denied]
        message:
          type: string
          description: One sentence the owner can act on.
        class:
          type: string
          description: >-
            Stable machine class. Binding liveness:
            `executor_not_in_control_set`, `lease_expired`, `account_expired`,
            `account_frozen`, `account_not_active`,
            `unsupported_wallet_implementation`, `unrecognized_wallet_code`,
            `binding_evidence_mismatch`, `chain_status_unreadable`. Spend
            grant: `grant_missing`, `grant_expired`, `grant_unreadable`,
            `grant_exhausted`, `receiver_not_granted`, `token_not_granted`,
            `token_budget_exceeded`, `collection_not_granted`,
            `item_not_granted`,
            `own_collection_refused`, `insufficient_vs_reserve`, and
            `grant_shape_violation:<subcode>` where subcode is one of
            `refund_target_not_allowed`, `grant_call_must_stand_alone`,
            `grant_call_deposit`, `grant_approval_not_allowed`,
            `grant_args_unreadable`, `grant_method_not_allowed`,
            `grant_action_not_allowed`.
        terminal:
          type: boolean
          description: >-
            `true` — do not retry. Every grant-layer class is terminal: the
            chain's answer does not change while the request and the grant
            stay as they are.
        promise_index:
          type: [integer, 'null']
          description: >-
            Which promise inside the decoded request the rule is about; `null`
            for a refusal about the request or the binding as a whole.
        additional_violations:
          type: integer
          description: >-
            How many further violations the same request carries beyond the one
            reported — whether fixing this one ends the matter.

    PutBindingRequest:
      type: object
      required: [asset_account_id]
      properties:
        asset_account_id:
          type: string
          description: >-
            Named NEAR account this wallet operates: the leased asset account
            (`agent.tla`) for `hos_lease`, the owner's own account
            (`user.near`) for `personal_account`.
        kind:
          type: string
          enum: [hos_lease, personal_account]
          default: hos_lease
          description: >-
            Binding mode. Omitted means `hos_lease`, byte-for-byte the
            pre-kind behavior.
        owner_account_id:
          type: string
          description: >-
            `hos_lease`: required; the account that authorized the lane, as
            reported at provisioning (informational — authorization is proven
            by the on-chain control set). `personal_account`: optional, and
            must equal `asset_account_id` — the owner IS the account.
        impl_version:
          type: integer
          description: >-
            `hos_lease` only (REQUIRED there, REJECTED for
            `personal_account`): wallet implementation version, read from the
            asset account's `hos_lease()`. Pins which request decoder applies;
            an unsupported value is rejected at binding time (terminal, do
            not retry).
      example:
        asset_account_id: agent.tla
        owner_account_id: owner.near
        impl_version: 6

    BindingResponse:
      type: object
      required:
        [binding_id, wallet_id, kind, asset_account_id,
         executor_account_id, binding_status, created_at]
      properties:
        binding_id:
          type: string
        wallet_id:
          type: string
        kind:
          type: string
          enum: [hos_lease, personal_account]
        asset_account_id:
          type: string
        executor_account_id:
          type: string
          description: >-
            The OutLayer execution identity — register it in the account's
            extension set (and, for hos_lease, provision its spend grant).
            NOTE: the response deliberately carries no owner. `owner_account_id`
            is accepted at PUT as the provisioning receipt House of Stake hands
            the integrator, and is stored — but it is checked for shape only and
            compared against nothing, so returning it would present a claim as
            an established fact. Who holds a leased account is
            `nft_item_info.owner_id` on chain, and what ends a lane when it
            changes hands is the rotation pin.
        binding_status:
          type: string
          enum: [pending, active, suspended, revoked]
          description: >-
            OutLayer's view only, not an attestation of chain state.
            `pending` until the executor is first observed live in the
            extension set; `suspended` on reversible faults (freeze,
            non-Active state, unsupported impl_version, unrecognized code
            hash); `revoked` is terminal (extension removed, lease/state
            expired, ownership rotated, or DELETE).
        impl_version:
          type: [integer, 'null']
          description: Absent for kind=personal_account.
        decoder_version:
          type: [integer, 'null']
          description: >-
            Derived by OutLayer, never client-supplied. Absent for
            kind=personal_account, whose versioning is the account's code
            hash checked at verify time.
        created_at:
          type: string
          format: date-time
        gas_balance:
          type: [string, 'null']
          description: >-
            Executor's native NEAR balance in yoctoNEAR (GET only). Null when
            the RPC could not answer.
        gas_balance_low:
          type: [boolean, 'null']
          description: >-
            The executor is under `gas_balance_threshold` and will soon be
            unable to pay for transactions — top it up. `null` means the
            balance could not be read, which is UNKNOWN rather than low. Poll
            this endpoint; there is no separate low-gas notification.
        gas_balance_threshold:
          type: [string, 'null']
          description: yoctoNEAR floor `gas_balance_low` is measured against.
      example:
        binding_id: bnd_7f3a2b1c9d8e4f60a1b2c3d4e5f60718
        wallet_id: 9c3c9e10-1c1f-4f5e-9c4a-1d7b9a8f3c20
        kind: hos_lease
        asset_account_id: agent.tla
        executor_account_id: 9c3c9e101c1f4f5e9c4a1d7b9a8f3c20
        binding_status: pending
        impl_version: 6
        decoder_version: 1
        created_at: '2026-08-18T14:00:00Z'

    BindingSetupResponse:
      type: object
      required: [kind, asset_account_id, executor_account_id, code_hash, transactions]
      properties:
        kind:
          type: string
          enum: [personal_account]
        asset_account_id:
          type: string
        executor_account_id:
          type: string
        code_hash:
          type: string
          description: >-
            Base58 code hash of the published no-sign wallet global contract —
            the same artifact the verifier's allowlist pins.
        transactions:
          type: array
          description: >-
            One transaction, three actions; receiver = signer = the owner's
            account.
          items:
            type: object
            required: [signer_id, receiver_id, actions]
            properties:
              signer_id:
                type: string
              receiver_id:
                type: string
              actions:
                type: array
                items:
                  type: object
      example:
        kind: personal_account
        asset_account_id: user.near
        executor_account_id: 9c3c9e101c1f4f5e9c4a1d7b9a8f3c20
        code_hash: BwjDnyemmBhrCyuviDGpoQAm9mdjTfrX7ZjqgZB4MHvM
        transactions:
          - signer_id: user.near
            receiver_id: user.near
            actions:
              - type: UseGlobalContract
                code_hash: BwjDnyemmBhrCyuviDGpoQAm9mdjTfrX7ZjqgZB4MHvM
              - type: FunctionCall
                method_name: w_init
                args: {}
                gas: '30000000000000'
                deposit: '1'
              - type: FunctionCall
                method_name: w_execute_extension
                args:
                  request:
                    internal:
                      - op: add_extension
                        payload:
                          account_id: 9c3c9e101c1f4f5e9c4a1d7b9a8f3c20
                gas: '30000000000000'
                deposit: '1'

    DeleteBindingResponse:
      type: object
      required: [binding_status, cancelled_approvals]
      properties:
        binding_status:
          type: string
          enum: [revoked]
        binding_id:
          type: [string, 'null']
          description: The record that was ended; absent when there was nothing to end.
        cancelled_approvals:
          type: integer
          description: >-
            Pending multisig approvals targeting the asset account that were
            cancelled rather than left completable. The requests those
            approvals were gating are moved to `cancelled` in the same step —
            an approval cancelled on its own stops the execution but leaves the
            request at `pending_approval` for good, unable to complete and
            never saying so. Requests already past the decision (`processing`)
            are left alone: they may have bytes on the wire.

    TokenInfo:
      type: object
      required: [id, symbol, chains, decimals]
      properties:
        id:
          type: string
        symbol:
          type: string
        chains:
          type: array
          items:
            $ref: '#/components/schemas/Chain'
        decimals:
          type: integer
        defuse_asset_id:
          type: string

    TokensResponse:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/TokenInfo'

    # ----- Wallet write -----
    CallRequest:
      type: object
      required: [receiver_id, method_name]
      properties:
        receiver_id:
          type: string
        method_name:
          type: string
        args:
          type: object
          additionalProperties: {}
          description: Method arguments as a JSON object. Mutually exclusive with `args_base64`.
        args_base64:
          type: string
          description: Pre-encoded base64 args. Use for non-JSON encodings.
        gas:
          type: string
          description: Gas budget in TGas as a string. Defaults to `30000000000000` (30 TGas) server-side.
        deposit:
          type: string
          description: Attached NEAR deposit in yoctoNEAR. Defaults to `0` server-side.

    CallResponse:
      type: object
      required: [request_id, status]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RequestStatus'
        tx_hash:
          type: [string, 'null']
        result:
          type: [object, 'null']
          additionalProperties: {}
          description: >-
            For `w_execute_extension` this also carries `promises`: one entry
            per promise of the decoded request, in the order the request listed
            them, each with `index`, `receiver`, `status`
            (`success` | `failed` | `unknown`), `receipt_id` and the chain's own
            `failure` object where it failed. `unknown` means the promise's
            receipt was not found in the outcome — it is NOT read as success,
            and its amounts are not charged to the velocity counters. A call
            the wallet contract REFUSED carries `promises: []`: the refusal
            happened before anything was detached, so no promise exists to
            report on, and none of the request is charged to the counters —
            read `failure` for the contract's reason.
        approval_id:
          type: [string, 'null']
          format: uuid
        required:
          type: [integer, 'null']
        approved:
          type: [integer, 'null']
        request_hash:
          type: [string, 'null']
          description: >-
            Present on `pending_approval` — sha256(canonical_json(op)); sign to
            approve.

    TransferRequest:
      type: object
      description: |-
        Native transfer on a single chain. Canonical recipient field is
        `to` — matches `WithdrawRequest.to` and the dashboard. The legacy
        field name `receiver_id` is still accepted as an alias for
        backward compatibility with clients that predate the rename;
        sending BOTH in the same body is rejected as a deserialization
        error.
      required: [to, amount]
      properties:
        chain:
          allOf:
            - $ref: '#/components/schemas/Chain'
          description: Chain to transfer on. Defaults to `near` server-side.
        to:
          type: string
          description: |-
            Recipient account id on `chain`. For NEAR, accepts both named
            accounts (`alice.near`) and 64-char implicit hex accounts.
          example: alice.near
        receiver_id:
          type: string
          deprecated: true
          description: |-
            **Deprecated alias for `to`.** Existing clients sending
            `receiver_id` continue to work; new clients should use `to`.
            Sending both `to` and `receiver_id` in the same body is
            rejected with a 400.
        amount:
          type: string
          description: Amount in the chain's smallest unit (yoctoNEAR, wei, …).

    DeleteRequest:
      type: object
      description: |-
        Irreversibly delete the wallet account and sweep its full NEAR balance
        to `beneficiary` (NEAR's native `DeleteAccount`).
      required: [beneficiary]
      properties:
        beneficiary:
          type: string
          description: |-
            Account that receives the deleted wallet's entire remaining
            balance. Must not be the wallet's own account.
          example: treasury.near
        chain:
          allOf:
            - $ref: '#/components/schemas/Chain'
          description: Chain the account lives on. Defaults to `near` server-side.

    DeleteResponse:
      type: object
      required: [request_id, status, beneficiary]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RequestStatus'
        tx_hash:
          type: [string, 'null']
        beneficiary:
          type: string
        approval_id:
          type: [string, 'null']
          format: uuid
        required:
          type: [integer, 'null']
        approved:
          type: [integer, 'null']
        request_hash:
          type: [string, 'null']
          description: >-
            Present on `pending_approval` — sha256(canonical_json(op)); sign to
            approve.

    StorageDepositRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: NEP-141 token contract (e.g. `wrap.near`). A `nep141:` prefix is stripped if present.
        account_id:
          type: [string, 'null']
          description: Account to register. Defaults to the wallet's own NEAR address.

    StorageDepositResponse:
      type: object
      description: |
        Response for `storageDeposit`. `storage_deposit` is multisig-capable: on
        a multisig wallet that requires approval the response carries
        `status=pending_approval` with the `approval_id` / `required` / `approved`
        / `request_hash` fields populated (same shape as `CallResponse`); the
        deposit executes only after the approval threshold is met. On the direct
        path those fields are omitted and the single-sig response is byte-identical
        to before.
      required: [request_id, status, token, account_id, already_registered]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RequestStatus'
        tx_hash:
          type: [string, 'null']
        token:
          type: string
        account_id:
          type: string
        already_registered:
          type: boolean
          description: True when the account was already storage-registered; no transaction was sent.
        approval_id:
          type: [string, 'null']
          format: uuid
          description: Present only on `pending_approval` (multisig) — the approval to vote on.
        required:
          type: [integer, 'null']
          description: Present only on `pending_approval` — approvals needed.
        approved:
          type: [integer, 'null']
          description: Present only on `pending_approval` — approvals collected so far.
        request_hash:
          type: [string, 'null']
          description: >-
            Present on `pending_approval` — sha256(canonical_json(op)); sign to
            approve.

    IntentsDepositRequest:
      type: object
      required: [token, amount]
      properties:
        token:
          type: string
        amount:
          type: string

    IntentsDepositResponse:
      type: object
      required: [request_id, status]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RequestStatus'
        tx_hash:
          type: [string, 'null']

    WithdrawRequest:
      type: object
      required: [chain, amount]
      properties:
        chain:
          $ref: '#/components/schemas/Chain'
        to:
          type: string
          description: Destination address on the target chain.
        amount:
          type: string
        token:
          type: string
          description: >-
            Token ID, e.g. `nep141:usdt.tether-token.near`. For `chain=near`,
            omit (or use `near`/`native`) to deliver **native NEAR** (unwraps the
            wallet's wNEAR); use `nep141:wrap.near` to deliver wNEAR instead. For
            other chains, this is the source Intents asset bridged via 1Click.
        async:
          type: boolean
          default: false
          description: >-
            When `true`, the call returns immediately with `status=processing`
            and a `poll_url`; the withdrawal settles in the background and the
            caller polls `GET /wallet/v1/requests/{request_id}` for the terminal
            status. **Recommended for cross-chain withdrawals**, whose bridge can
            take longer than the synchronous response window. When `false`
            (default) the call blocks until the withdrawal settles. Auth, policy
            and validation errors are returned synchronously in both modes; in
            async mode only an execution failure surfaces as the request's
            `failed` status.

    IntentsTransferRequest:
      type: object
      required: [to, amount, token]
      properties:
        to:
          type: string
          description: >-
            Recipient NEAR account id (named or 64-hex implicit). Credited inside
            `intents.near`; the account need not exist on-chain.
        amount:
          type: string
          description: Amount in minimal units (integer string).
        token:
          type: string
          description: >-
            Defuse asset id, e.g. `nep141:usdt.tether-token.near` (a bare
            `usdt.tether-token.near` is normalized to `nep141:`). To send NEAR,
            use `nep141:wrap.near`.

    WithdrawResponse:
      type: object
      description: |
        Response for `intentsWithdraw` (same-chain AND cross-chain). On a
        multisig wallet that requires approval, `status=pending_approval` and the
        `approval_id` / `required` / `approved` / `request_hash` fields are
        populated; approvers sign `request_hash` (see `Nep413Auth`). On the
        direct path these fields are omitted/null.
      required: [request_id, status]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RequestStatus'
        approval_id:
          type: [string, 'null']
          format: uuid
        required:
          type: [integer, 'null']
        approved:
          type: [integer, 'null']
        request_hash:
          type: [string, 'null']
          description: >-
            Canonical request hash to sign when `status=pending_approval`
            (otherwise absent).
        poll_url:
          type: [string, 'null']
          description: >-
            Present when `async=true` (`status=processing`) — poll this path
            (`GET /wallet/v1/requests/{request_id}`) for the terminal status.

    DryRunResponse:
      type: object
      properties:
        would_succeed:
          type: boolean
        reason:
          type: string
          description: >-
            Present when `would_succeed` is false. One of: `wallet_frozen`,
            `policy_denied`, `storage_not_registered` (wNEAR/NEP-141 recipient has no
            token storage), `recipient_not_found` (native NEAR to a non-existent named
            account — would burn the wNEAR), `insufficient_balance` (intents balance
            below the requested amount), `invalid_request` (body the real withdraw
            would reject with a 400), `bridge_rejected` (1Click refused the
            cross-chain quote — below the bridge minimum, unsupported route or no
            liquidity; `message` carries 1Click's own text, e.g. "Amount is too low
            for bridge, try at least 303064").
        message:
          type: string
        estimated_fee:
          type: string
        fee_token:
          type: string
        policy_check:
          $ref: '#/components/schemas/PolicyCheckResult'

    PolicyCheckResult:
      type: object
      description: |
        Policy evaluation summary attached to a dry-run. Present whenever the
        policy engine ran (i.e. not on a `wallet_frozen` short-circuit). On a
        `policy_denied` result `within_limits` is false and the optional fields
        are omitted; on an allowed / requires-approval result `within_limits` is
        true and `address_allowed` is populated.
      required: [within_limits]
      properties:
        within_limits:
          type: boolean
          description: True when the op is within the wallet's spending limits.
        daily_remaining:
          type: [string, 'null']
          description: Remaining daily allowance in minimal units, when the policy tracks one.
        address_allowed:
          type: [boolean, 'null']
          description: True when the destination address passed the policy allowlist.

    SwapRequest:
      type: object
      required: [token_in, token_out, amount_in]
      properties:
        token_in:
          type: string
        token_out:
          type: string
        amount_in:
          type: string
        min_amount_out:
          type: string

    SwapResponse:
      type: object
      description: |
        Response for `intentsSwap`. Swap is a **Trusted** op, so on a multisig
        wallet it can return `status=pending_approval` with the
        `approval_id` / `required` / `approved` / `request_hash` fields populated
        (same shape as `WithdrawResponse`); the swap executes only after the
        approval threshold is met. On the direct path those fields are omitted and
        `amount_out` / `intent_hash` carry the settled result.
      required: [request_id, status]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RequestStatus'
        amount_out:
          type: string
        intent_hash:
          type: string
        approval_id:
          type: [string, 'null']
          format: uuid
        required:
          type: [integer, 'null']
        approved:
          type: [integer, 'null']
        request_hash:
          type: [string, 'null']
          description: >-
            Canonical request hash to sign when `status=pending_approval`
            (otherwise absent).

    SwapQuoteResponse:
      type: object
      properties:
        amount_out:
          type: string
        min_amount_out:
          type: string
        deadline:
          type: string
          format: date-time
        time_estimate_seconds:
          type: integer

    DefuseAssetId:
      type: string
      description: |-
        NEAR Intents `defuse_asset_id`. Currently always a NEP-141 token
        identifier of the form `nep141:<contract>`. Format matches the
        [`TokenInfo.defuse_asset_id`](#/components/schemas/TokenInfo) field
        returned by `listTokens`.
      example: nep141:wrap.near

    DestinationAsset:
      allOf:
        - $ref: '#/components/schemas/DefuseAssetId'
      description: |-
        Defuse asset id the recipient will hold after the cross-chain deposit
        settles. Defaults to NEAR USDC.
      default: nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1

    DepositIntentRequest:
      description: |-
        Request body for `createDepositIntent`. Two shapes accepted; see the
        `anyOf` branches below. `amount` is always required. The
        `destination_asset` field defaults to NEAR USDC
        (`nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`)
        when omitted — see
        [`DestinationAsset`](#/components/schemas/DestinationAsset).

        Uses `anyOf` (not `oneOf`) deliberately — a request that supplies
        both `source_asset` and `chain` matches both branches; the
        coordinator resolves the conflict by preferring `source_asset` and
        logging a warning, so `oneOf`'s strict "exactly one match" rule
        would needlessly reject valid requests.
      anyOf:
        - title: BySourceAsset
          description: |-
            Preferred shape. The source chain is derived from the
            `source_asset` prefix (e.g. `nep141:eth-…` → ethereum,
            `nep141:base-…` → base, `nep141:btc.omft.near` → bitcoin,
            anything else `nep141:<contract>.near` → near).
          type: object
          required: [source_asset, amount]
          properties:
            source_asset:
              allOf:
                - $ref: '#/components/schemas/DefuseAssetId'
              description: |-
                NEAR Intents `defuse_asset_id` of the source token. The
                source chain is derived from this id.
              example: nep141:base-0x833589fcd6edb6e08f4c7c32d4f71b54bda02913.omft.near
            destination_asset:
              $ref: '#/components/schemas/DestinationAsset'
            amount:
              type: string
              description: Amount in the source token's smallest unit (e.g. `5000000` = 5 USDC).
            refund_address:
              type: string
              description: |-
                Address on the source chain to refund to if the cross-chain
                deposit fails. Defaults to the wallet's derived address on that
                chain.
        - title: ByChainAndToken
          description: |-
            Legacy shape — kept for backwards compatibility. The coordinator
            resolves `(chain, token)` to a `source_asset` via the 1Click
            token catalog.
          type: object
          required: [chain, amount]
          properties:
            chain:
              type: string
              description: |-
                Source chain. Supported: `near`, `ethereum`, `base`,
                `arbitrum`, `solana`, `bitcoin`, `bsc`, `polygon`,
                `optimism`, `avalanche`.
              example: ethereum
            token:
              type: string
              description: Source token symbol on the origin chain. Defaults to `USDC`.
              default: USDC
            destination_asset:
              $ref: '#/components/schemas/DestinationAsset'
            amount:
              type: string
            refund_address:
              type: string

    DepositIntentResponse:
      type: object
      required:
        - intent_id
        - deposit_address
        - amount
        - amount_out
        - min_amount_out
      properties:
        intent_id:
          type: string
        deposit_address:
          type: string
          description: |-
            One-time address on the source chain — send funds here. The
            address format depends on the resolved source chain:

            - `near` — 64-char hex (NEAR implicit account), e.g.
              `f51768dc0c4d4bbb78890262da9882dee2ee5b6c2fcf2c527e56c6eadcb54353`
            - `ethereum` / `base` / `arbitrum` / `bsc` / `polygon` /
              `optimism` / `avalanche` — `0x` + 40 hex (EVM), e.g.
              `0x582290c0b2Cb60989B35FFF66049f3e3247355bc`
            - `solana` — base58, 32-44 chars (Solana), e.g.
              `5AmGa2Bcfajbytg55UUb4vCAAzKBMYKZNQwx5S2BH2qf`
            - `bitcoin` — `bc1…` (segwit) or `1…` / `3…` (legacy)

            Sending tokens to an address whose format doesn't match the
            source chain will lose the funds — always verify the format
            client-side before initiating the transfer.
        amount:
          type: string
        amount_out:
          type: string
          description: Amount credited after the cross-chain deposit fee.
        min_amount_out:
          type: string
        expires_at:
          type: string
          format: date-time
          description: |-
            Deadline after which the deposit address is no longer
            guaranteed to be honored by 1Click. Absent if 1Click did not
            return a deadline.
        estimated_time_secs:
          type: integer
          description: |-
            Solver's estimate of deposit settlement time, in seconds. Absent
            if 1Click did not return an estimate.
        hint:
          type: string
          description: |-
            Non-binding advisory when a faster / cheaper endpoint exists
            for the same logical operation. Present only when the resolved
            source chain is `near` — in that case the caller's funds are
            already on NEAR and `POST /wallet/v1/intents/deposit` would do
            the deposit in one direct `ft_transfer_call` without the
            1Click solver hop. Clients that don't read this field are
            unaffected; clients that prefer the most direct path can
            switch endpoints on receiving it.

    DepositStatusResponse:
      type: object
      required: [intent_id, status, amount, deposit_address, created_at]
      properties:
        intent_id:
          type: string
        status:
          type: string
          enum: [pending, bridging, success, failed, expired]
        amount:
          type: string
          description: Deposit amount in the source token's minimal units.
        deposit_address:
          type: string
          description: The one-time source-chain address funds were to be sent to.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
          description: 1Click deadline after which the deposit address is no longer honored.
        result:
          type: [object, 'null']
          additionalProperties: {}

    # ----- Payment checks -----
    PaymentCheckCreateRequest:
      type: object
      required: [token, amount]
      properties:
        token:
          type: string
          description: >-
            Token to fund the check with. Accepts a `defuse_asset_id`
            (`nep141:<contract>`) or a bare NEP-141 contract id; normalized
            server-side.
        amount:
          type: string
          description: Amount in the token's minimal units. Must be > 0.
        memo:
          type: [string, 'null']
          description: Optional note (max 256 chars) surfaced to whoever peeks/claims the check.
        expires_in:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: >-
            Optional time-to-live in seconds from creation. After it elapses an
            unclaimed check reports `expired` and can no longer be claimed (only
            reclaimed by the creator).

    PaymentCheckCreateResponse:
      type: object
      required: [check_id, check_key, token, amount, created_at]
      properties:
        check_id:
          type: string
          format: uuid
          description: Server-side identifier for the check (used by status / reclaim).
        check_key:
          type: string
          description: >-
            The ephemeral account's ed25519 private key (64 hex chars). Bearer
            secret — whoever holds it can claim the funds. Returned ONCE.
        token:
          type: string
        amount:
          type: string
        memo:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time

    PaymentCheckBatchCreateRequest:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/PaymentCheckCreateRequest'

    PaymentCheckBatchCreateResponse:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/PaymentCheckCreateResponse'

    PaymentCheckClaimRequest:
      type: object
      required: [check_key]
      properties:
        check_key:
          type: string
          description: The check's ephemeral private key (64 hex chars).
        amount:
          type: [string, 'null']
          description: >-
            Optional partial claim amount in minimal units. Omit to claim the
            full remaining balance.

    PaymentCheckClaimResponse:
      type: object
      required: [token, amount_claimed, remaining, claimed_at]
      properties:
        token:
          type: string
        amount_claimed:
          type: string
        remaining:
          type: string
          description: Amount still claimable on the check after this claim (minimal units).
        memo:
          type: [string, 'null']
        claimed_at:
          type: string
          format: date-time
        intent_hash:
          type: [string, 'null']
          description: base58 solver-relay intent hash for the claim transfer, if returned.

    PaymentCheckReclaimRequest:
      type: object
      required: [check_id]
      properties:
        check_id:
          type: string
          format: uuid
          description: The `check_id` of a check the authenticated wallet created.
        amount:
          type: [string, 'null']
          description: >-
            Optional partial reclaim amount in minimal units. Omit to reclaim the
            full remaining balance.

    PaymentCheckReclaimResponse:
      type: object
      required: [token, amount_reclaimed, remaining, reclaimed_at]
      properties:
        token:
          type: string
        amount_reclaimed:
          type: string
        remaining:
          type: string
          description: Amount still outstanding on the check after this reclaim (minimal units).
        reclaimed_at:
          type: string
          format: date-time
        intent_hash:
          type: [string, 'null']
          description: base58 solver-relay intent hash for the reclaim transfer, if returned.

    PaymentCheckStatusResponse:
      type: object
      required:
        - check_id
        - token
        - amount
        - claimed_amount
        - reclaimed_amount
        - status
        - created_at
      properties:
        check_id:
          type: string
          format: uuid
        token:
          type: string
        amount:
          type: string
          description: Original check amount in minimal units.
        claimed_amount:
          type: string
          description: Total claimed so far (minimal units).
        reclaimed_amount:
          type: string
          description: Total reclaimed so far (minimal units).
        status:
          type: string
          description: >-
            Lifecycle state: `unclaimed`, `claiming`, `partially_claimed`,
            `claimed`, `reclaiming`, `partially_reclaimed`, `reclaimed`, or the
            virtual `expired` (unclaimed and past `expires_at`).
        memo:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        claimed_at:
          type: [string, 'null']
          format: date-time
        claimed_by:
          type: [string, 'null']
          description: Wallet id that claimed the check, if any.

    PaymentCheckListResponse:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/PaymentCheckStatusResponse'

    PaymentCheckPeekRequest:
      type: object
      required: [check_key]
      properties:
        check_key:
          type: string
          description: The check's ephemeral private key (64 hex chars).

    PaymentCheckPeekResponse:
      type: object
      required: [token, balance, status]
      properties:
        token:
          type: string
        balance:
          type: string
          description: Live on-chain balance of the check's ephemeral account (minimal units).
        memo:
          type: [string, 'null']
        status:
          type: string
          description: Same status vocabulary as `PaymentCheckStatusResponse`.
        expires_at:
          type: [string, 'null']
          format: date-time

    SignMessageRequest:
      type: object
      required: [message, recipient]
      properties:
        message:
          type: string
        recipient:
          type: string
        nonce:
          type: string
          description: Base64-encoded 32-byte nonce. Auto-generated if omitted.
        format:
          type: string
          description: >-
            NEP-413 only. `raw` is **rejected** (`400 bad_request`) — use
            [`authSign`](#tag/Wallet/operation/authSign) for OutLayer NEAR-key
            auth. The field is retained only to return that redirect error.
          enum: [nep413]
          default: nep413

    SignMessageResponse:
      type: object
      properties:
        account_id:
          type: string
        signature:
          type: string
        signature_base64:
          type: string
        public_key:
          type: string
        nonce:
          type: string

    AuthSignRequest:
      type: object
      required: [purpose, seed]
      properties:
        purpose:
          type: string
          description: >-
            `bearer` → challenge `auth:<seed>:<ts>` (+`:<vault>` when `vault_id`
            set); `register` → `register:<seed>:<ts>`; `api-key` →
            `api-key:<seed>:<ts>`.
          enum: [bearer, register, api-key]
        seed:
          type: string
          description: Wallet seed — selects which sub-wallet's key signs.
        vault_id:
          type: string
          description: Vault scope — only valid for `purpose=bearer`.

    AuthSignResponse:
      type: object
      required: [auth_message, auth_timestamp, signature, public_key]
      properties:
        auth_message:
          type: string
          description: >-
            The exact challenge string the keystore built and signed — send this
            verbatim.
        auth_timestamp:
          type: integer
          format: int64
          description: Fresh server timestamp (unix seconds) baked into `auth_message`.
        signature:
          type: string
          description: Raw ed25519 signature over `auth_message`, base58 (no `ed25519:` prefix).
        public_key:
          type: string
          description: Signer public key in `ed25519:<base58>` form.

    # ----- Policy -----
    PolicyRules:
      type: object
      properties:
        transaction_types:
          type: array
          description: >-
            Allowed op types (allowlist). Omit to allow all. `cross_chain_withdraw`
            must be listed explicitly to permit bridging out (it is NOT covered by
            `withdraw`). The deposit family gates as `call`.
          items:
            $ref: '#/components/schemas/RequestType'
        allowed_tokens:
          type: array
          description: >-
            Token allowlist (defuse asset ids, or `"*"` for any). Omit or use
            `["*"]` to allow all tokens.
          items:
            type: string
        addresses:
          $ref: '#/components/schemas/AddressList'
        limits:
          $ref: '#/components/schemas/PolicyLimits'
        time_restrictions:
          $ref: '#/components/schemas/TimeRestrictions'
        rate_limit:
          $ref: '#/components/schemas/RateLimit'

    PolicyLimits:
      type: object
      description: |
        Per-period spending limits. The amount fields are maps of
        `token_id → amount` (use `"*"` as the key to match all tokens).
        `per_transaction` is STATELESS (enforced on every signature inside the
        TEE); `hourly` / `daily` / `monthly` and `hourly_tx_count` are STATEFUL
        velocity limits (checked against coordinator-supplied usage; best-effort
        under concurrency).
      properties:
        per_transaction:
          type: object
          additionalProperties:
            type: string
        hourly:
          type: object
          additionalProperties:
            type: string
        daily:
          type: object
          additionalProperties:
            type: string
        monthly:
          type: object
          additionalProperties:
            type: string
        hourly_tx_count:
          type: integer
          description: >-
            Max number of transactions per rolling hour (transaction-count rate
            limit; equivalent to `rate_limit.max_per_hour`).

    AddressList:
      type: object
      required: [mode, list]
      properties:
        mode:
          type: string
          enum: [whitelist, blacklist]
        list:
          type: array
          items:
            type: string

    TimeRestrictions:
      type: object
      properties:
        timezone:
          type: string
          description: IANA timezone name, e.g. `UTC` or `Europe/Berlin`.
        allowed_hours:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 23
        allowed_days:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: 0 = Sunday, 6 = Saturday.

    RateLimit:
      type: object
      properties:
        max_per_hour:
          type: integer

    ApprovalConfig:
      type: object
      description: |
        Multisig approval configuration. When set, an op that trips the approval
        trigger returns `pending_approval` and executes only after `threshold`
        approvers sign. Applies to fund ops including the Trusted kinds (swap,
        confidential, cross_chain_withdraw); `payment_check` is excluded from the
        generic trigger (cap-gated instead).
      properties:
        threshold:
          description: >-
            Number of approvals required — either a bare integer (e.g. `2`) or an
            object `{ "required": N }`.
          oneOf:
            - type: integer
              minimum: 1
            - type: object
              required: [required]
              properties:
                required:
                  type: integer
                  minimum: 1
        approvers:
          type: array
          items:
            $ref: '#/components/schemas/Approver'
        excluded_types:
          type: array
          description: Op types exempt from the generic approval trigger.
          items:
            $ref: '#/components/schemas/RequestType'

    Approver:
      type: object
      required: [id, pubkey]
      properties:
        id:
          type: string
          description: Approver's NEAR account id, e.g. `alice.near`.
        pubkey:
          type: string
          description: >-
            Approver's NEAR public key (`ed25519:<base58>`), pinned on-chain. The
            approver's NEP-413 vote signature is verified against this key.
        role:
          type: string
          description: >-
            Optional. `admin` may also modify policy / freeze; `signer` may only
            approve transactions. Defaults to `signer` when omitted.
          enum: [admin, signer]

    AdminQuorum:
      type: object
      required: [required, admins]
      properties:
        required:
          type: integer
        admins:
          type: array
          items:
            type: string

    Capability:
      type: object
      description: >-
        A single non-Built primitive toggle. All capabilities default to DENY
        except `sign_message`. `requires_approval` opts that primitive into
        multisig specifically.
      properties:
        allowed:
          type: boolean
        requires_approval:
          type: boolean

    RawSignCapability:
      type: object
      description: >-
        `raw_sign` — sign arbitrary raw bytes. `chains` is an optional allowlist;
        when absent, ALL chains (including `near`, which can sign a NEAR tx/intent
        outside the structured policy — enable with care).
      properties:
        allowed:
          type: boolean
        requires_approval:
          type: boolean
        chains:
          type: array
          items:
            type: string

    SignMessageCapability:
      type: object
      description: >-
        `sign_message` — generic non-fund NEP-413 (e.g. dApp login). Defaults
        ALLOWED. `allowed_recipients` is a default-DENY allowlist of verifier
        recipients (NOT a blocklist); `intents.near` / `intents.far` are always
        excluded. This is NOT OutLayer auth (that is `authSign`).
      properties:
        allowed:
          type: boolean
        requires_approval:
          type: boolean
        allowed_recipients:
          type: array
          items:
            type: string

    EvmSignCapability:
      type: object
      description: >-
        `evm_sign` — EVM signing (EIP-712 typed-data / EIP-191 personal_sign /
        raw tx). **Default-DENY under a policy** (like the other fund-moving
        capabilities) — set `allowed: true` to permit. A wallet with no policy is
        unrestricted. CAVEAT (why it must be opt-in): an EIP-712 signature is
        itself fund-moving (EIP-3009 `TransferWithAuthorization` ≈ transfer,
        EIP-2612 `Permit` ≈ approve), so this grants full authority over the EVM
        address's float (bounded to what you bridge there — the NEAR-intents
        balance is never exposed to any EVM signature). `raw_tx` (default false)
        is a SEPARATE kill-switch for arbitrary raw transactions; it does NOT
        contain typed-data drains.
      properties:
        allowed:
          type: boolean
          description: Master on/off for EVM signing. Default false (opt in with true).
        raw_tx:
          type: boolean
          description: Permit signing arbitrary raw EVM transactions. Default false.

    SolanaSignCapability:
      type: object
      description: >-
        `solana_sign` — Solana signing (off-chain messages / transaction
        messages). **Default-DENY under a policy** (same model as `evm_sign`) —
        set `allowed: true` to permit. A wallet with no policy is unrestricted.
        CAVEAT: a signed Solana transaction message is itself fund-moving, so
        `raw_tx` grants full authority over the Solana address's float (bounded
        to what you send there — the NEAR-intents balance is never exposed to
        any Solana signature). The base flag covers message signing only; the
        service rejects "message" bytes that parse as a valid transaction
        message, so the message endpoint cannot bypass `raw_tx`.
      properties:
        allowed:
          type: boolean
          description: Master on/off for Solana signing. Default false (opt in with true).
        raw_tx:
          type: boolean
          description: Permit signing Solana transaction messages. Default false.

    Capabilities:
      type: object
      description: |
        Default-DENY opt-ins for the non-Built primitives, stored alongside
        `rules` / `approval` in the encrypted policy. Every capability defaults to
        DENY under a policy **except** `sign_message` (default-allow). A wallet
        with no policy at all is unrestricted.
      properties:
        raw_sign:
          $ref: '#/components/schemas/RawSignCapability'
        confidential:
          $ref: '#/components/schemas/Capability'
        swap:
          $ref: '#/components/schemas/Capability'
        cross_chain_withdraw:
          $ref: '#/components/schemas/Capability'
        payment_check:
          $ref: '#/components/schemas/Capability'
        sign_message:
          $ref: '#/components/schemas/SignMessageCapability'
        evm_sign:
          $ref: '#/components/schemas/EvmSignCapability'
        solana_sign:
          $ref: '#/components/schemas/SolanaSignCapability'

    EvmSignTypedDataRequest:
      type: object
      required: [chain, typed_data]
      properties:
        chain:
          $ref: '#/components/schemas/Chain'
        typed_data:
          type: object
          description: >-
            Standard EIP-712 v4 object (as `eth_signTypedData_v4`):
            `{ domain, types, primaryType, message }`. Arbitrary struct types are
            supported (incl. EIP-3009 `TransferWithAuthorization` and EIP-2612
            `Permit`). The digest is computed server-side — no client-supplied
            hash is trusted.

    EvmSignMessageRequest:
      type: object
      required: [chain, message]
      properties:
        chain:
          $ref: '#/components/schemas/Chain'
        message:
          type: string
          description: >-
            The message to sign under EIP-191 `personal_sign`, interpreted per
            `encoding`.
        encoding:
          type: string
          enum: [utf8, hex]
          default: utf8
          description: >-
            How to interpret `message`. `utf8` (default) signs its UTF-8 bytes
            (matches viem `hashMessage(string)` / MetaMask `personal_sign`);
            `hex` treats `message` as hex (`0x`-prefixed or bare) and signs the
            decoded bytes (viem `hashMessage({ raw })`). No content sniffing —
            malformed hex is rejected.

    EvmSignTransactionRequest:
      type: object
      required: [chain, unsigned_tx]
      properties:
        chain:
          $ref: '#/components/schemas/Chain'
        unsigned_tx:
          type: string
          description: >-
            Serialized unsigned transaction, `0x`-hex (e.g. viem
            `serializeTransaction(tx)`). The service keccak256-hashes and signs
            it — it does not parse, assemble, or broadcast the transaction.

    EvmSignResponse:
      type: object
      required: [signature, chain, wallet_id]
      properties:
        signature:
          type: string
          description: >-
            65-byte recoverable EVM signature, `0x`-hex (`r‖s‖v`, `v ∈ {27,28}`,
            low-s). `ecrecover` over the signed digest returns the wallet's EVM
            address.
        chain:
          $ref: '#/components/schemas/Chain'
        wallet_id:
          type: string

    SolanaSignMessageRequest:
      type: object
      required: [chain, message]
      properties:
        chain:
          $ref: '#/components/schemas/Chain'
        message:
          type: string
          description: >-
            The message to sign, interpreted per `encoding`. The decoded bytes
            are signed as-is; bytes that parse as a valid Solana transaction
            message are rejected (use `/wallet/v1/solana/sign-transaction`).
        encoding:
          type: string
          enum: [utf8, hex, base64]
          default: utf8
          description: >-
            How to interpret `message`. `utf8` (default) signs its UTF-8 bytes;
            `hex` (`0x`-prefixed or bare) / `base64` decode `message` first and
            sign the decoded bytes. No content sniffing — malformed input is
            rejected.

    SolanaSignTransactionRequest:
      type: object
      required: [chain, unsigned_tx]
      properties:
        chain:
          $ref: '#/components/schemas/Chain'
        unsigned_tx:
          type: string
          description: >-
            Serialized unsigned transaction **message**, base64 (what the
            signature covers: web3.js `tx.serializeMessage()` /
            `versionedTx.message.serialize()`; max 1232 bytes — the Solana
            packet limit). The service signs the bytes as-is — it does not
            parse, assemble, or broadcast the transaction.

    SolanaSignResponse:
      type: object
      required: [signature, chain, wallet_id]
      properties:
        signature:
          type: string
          description: >-
            64-byte ed25519 signature, base58 (Solana convention). Verifies
            against the wallet's Solana address (its base58 ed25519 public key)
            over the exact submitted bytes.
        chain:
          $ref: '#/components/schemas/Chain'
        wallet_id:
          type: string

    PolicyResponse:
      type: object
      required: [wallet_id, controller, frozen]
      properties:
        wallet_id:
          type: string
        controller:
          type: string
          description: NEAR account that owns the policy.
        frozen:
          type: boolean
        rules:
          $ref: '#/components/schemas/PolicyRules'
        approval:
          $ref: '#/components/schemas/ApprovalConfig'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        authorized_key_hashes:
          type: array
          items:
            type: string
        usage:
          type: object
          additionalProperties: {}
          description: |
            Current accumulated usage per token, per period. Same shape as
            `PolicyLimits` — used for client-side velocity-limit visualization.

    EncryptPolicyRequest:
      type: object
      required: [wallet_id, rules]
      properties:
        wallet_id:
          type: string
        rules:
          $ref: '#/components/schemas/PolicyRules'
        approval:
          $ref: '#/components/schemas/ApprovalConfig'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        admin_quorum:
          $ref: '#/components/schemas/AdminQuorum'
        webhook_url:
          type: string
          format: uri
        authorized_key_hashes:
          type: array
          items:
            type: string

    EncryptPolicyResponse:
      type: object
      required: [encrypted_base64, wallet_pubkey]
      properties:
        encrypted_base64:
          type: string
        wallet_pubkey:
          type: string

    SignPolicyRequest:
      type: object
      required: [encrypted_data, caller]
      properties:
        encrypted_data:
          type: string
        caller:
          type: string
          description: |
            The NEAR account that will send `store_wallet_policy`. Signed, so
            the signature is usable by that account only.

    SignPolicyResponse:
      type: object
      required: [signature_hex, public_key_hex]
      properties:
        signature_hex:
          type: string
        public_key_hex:
          type: string

    InvalidateCacheRequest:
      type: object
      required: [wallet_id]
      properties:
        wallet_id:
          type: string

    # ----- Approvals -----
    PendingApproval:
      type: object
      required: [approval_id, type, request_data, request_hash, decision, required, approved, expires_at]
      properties:
        approval_id:
          type: string
          format: uuid
        request_id:
          type: [string, 'null']
          format: uuid
        type:
          $ref: '#/components/schemas/RequestType'
        request_data:
          type: object
          additionalProperties: {}
        op:
          type: [object, 'null']
          additionalProperties: {}
          description: >-
            Canonical op to RENDER (parsed from the stored canonical JSON). The
            dashboard renders this directly. `null` for legacy rows predating
            canonical-op storage.
        decoded_effects:
          type: [object, 'null']
          additionalProperties: {}
          description: >-
            Present ONLY for a `w_execute_extension` op (Agent Connect's
            extension door), whose own fields describe nothing: the destination
            is the agent's own account and the deposit is a mandated 1-yocto
            marker, while every real recipient and amount is nested in
            `args_base64`. This is those contents, decoded from the same bytes
            `request_hash` covers — an approver renders it INSTEAD of guessing
            from `op`. Absent for every other operation, which states its
            effects in its own fields.


            Shape: `native_total` (yocto, decimal string), `action_count`,
            `promises[]` (`index`, `receiver`, `refund_to`, `native`),
            `token_moves[]` (`promise`, `method`, `token`, `recipient`,
            `amount`, `unit` = `token_units` | `token_id`),
            `storage_registrations[]`, plus `internal_ops[]` and
            `unstatable_calls[]` — the last two are refused before an approval
            can exist and are rendered only so their presence could never be
            silent.
        request_hash:
          type: string
          description: >-
            Canonical request hash to SIGN — approvers sign
            `approve:{approval_id}:{wallet_pubkey}:{request_hash}` (see
            `Nep413Auth`).
        decision:
          type: string
          description: Always `requires_approval` for a pending row.
          enum: [requires_approval]
        required:
          type: integer
        approved:
          type: integer
        expires_at:
          type: string
          format: date-time

    PendingApprovalsResponse:
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/PendingApproval'

    ApprovalDetail:
      type: object
      description: >-
        Public, read-only detail for one pending approval (`getApprovalDetail`).
        Returns only non-sensitive metadata. `wallet_pubkey` + `request_hash` are
        what an approver binds into the NEP-413 vote (see `Nep413Auth`); the
        dashboard renders `op`.
      required:
        - id
        - wallet_id
        - request_type
        - request_data
        - status
        - required_approvals
        - request_hash
        - wallet_pubkey
        - expires_at
        - created_at
        - approvers
      properties:
        id:
          type: string
          format: uuid
        wallet_id:
          type: string
        request_type:
          $ref: '#/components/schemas/RequestType'
        request_data:
          type: object
          additionalProperties: {}
        status:
          type: string
          enum: [pending, approved, rejected, expired]
        required_approvals:
          type: integer
        request_hash:
          type: string
        op:
          type: [object, 'null']
          additionalProperties: {}
          description: Canonical op for the dashboard to render. `null` for legacy rows.
        decoded_effects:
          type: [object, 'null']
          additionalProperties: {}
          description: >-
            What a `w_execute_extension` op actually moves, decoded from the
            same bytes `request_hash` covers — see `PendingApproval` for the
            shape and for why rendering `op` alone would show an approver
            nothing about the money. `null` for every other operation.
        wallet_pubkey:
          type: string
          description: On-chain wallet pubkey bound into the approve/reject vote message.
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        approvers:
          type: array
          description: Signatures collected so far.
          items:
            type: object
            required: [approver_id, approver_role, signature, created_at]
            properties:
              approver_id:
                type: string
              approver_role:
                type: string
              signature:
                type: string
              created_at:
                type: string
                format: date-time

    Nep413Auth:
      type: object
      description: |
        NEP-413 signed authentication payload. The signed message binds the
        wallet's on-chain pubkey so a vote can't be replayed onto another wallet:
        `approve:{approval_id}:{wallet_pubkey}:{request_hash}` for approve, or
        `reject:{approval_id}:{wallet_pubkey}:{request_hash}` for reject. The
        `wallet_pubkey` and `request_hash` come from `getApprovalDetail` (or
        `listPendingApprovals`). `recipient` for the NEP-413 signature is the
        wallet contract id.
      required: [signature, public_key, account_id, nonce]
      properties:
        signature:
          type: string
        public_key:
          type: string
        account_id:
          type: string
        nonce:
          type: string

    RejectRequest:
      allOf:
        - $ref: '#/components/schemas/Nep413Auth'
        - type: object
          properties:
            reason:
              type: string

    ApproveResponse:
      type: object
      required: [approval_id, status, approved, required]
      properties:
        approval_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, rejected, expired]
        approved:
          type: integer
        required:
          type: integer
        request_id:
          type: [string, 'null']
          format: uuid

    RejectResponse:
      type: object
      required: [approval_id, status]
      properties:
        approval_id:
          type: string
          format: uuid
        status:
          type: string
          description: >-
            `rejected` — the reject came from a REAL policy approver, so the request is
            cancelled (a real reject vetoes it irrevocably). `reject_vote_recorded` — the
            signer is not a configured approver: the vote is stored and the request stays
            `pending_approval` (the keystore still vetoes execution at sign time).
          enum: [rejected, reject_vote_recorded]

    # ----- Audit & requests -----
    AuditEvent:
      type: object
      required: [type, details, at]
      properties:
        type:
          type: string
        request_id:
          type: [string, 'null']
        status:
          type: [string, 'null']
        details:
          type: object
          additionalProperties: {}
        at:
          type: string
          format: date-time

    AuditResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'

    RequestStatusResponse:
      type: object
      required: [request_id, type, status, created_at]
      properties:
        request_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/RequestType'
        status:
          $ref: '#/components/schemas/RequestStatus'
        result:
          description: |-
            Operation-specific result payload, present once `status` is
            `success` (otherwise `null` or an `{ "error": "<reason>" }` object
            on `failed`). The shape depends on `type`:

            - `type = "withdraw"` — conforms to
              [`WithdrawResult`](#/components/schemas/WithdrawResult).
            - Cross-chain withdraws (`intents_cross_chain_withdraw`) and
              gasless swaps additionally carry a nullable
              `destination_tx_hash` — the real delivery transaction on the
              destination chain (safe to render as an explorer link on the
              requested chain). `null` until the 1Click bridge settles; the
              lazy on-read refresh fills it in, and the `request_completed`
              webhook carries it. All other identifier fields
              (`transfer_intent_hash`, `intent_hash`) are NEAR-Intents
              hashes, NOT destination-chain transactions.
            - Other request types are not yet schema-documented; treat the
              object as opaque until added in a later spec release.

            Uses `anyOf` (not `oneOf`) deliberately — `WithdrawResult` is also
            a valid `object`, and `oneOf` would require exactly one match,
            so a successful withdraw would fail strict validators.
          anyOf:
            - $ref: '#/components/schemas/WithdrawResult'
            - type: 'null'
            - type: object
              additionalProperties: {}
        created_at:
          type: string
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time

    WithdrawResult:
      type: object
      description: |-
        Result payload for a successful `withdraw` request — what the
        recipient actually received on-chain. Emitted in the `result` field of
        `GET /wallet/v1/requests/{id}` and in the `result` field of the
        `request_completed` webhook for withdraw requests.
      required: [intent_hash, delivered]
      properties:
        intent_hash:
          type: string
          description: |-
            Base58-encoded NEAR Intents hash returned by `solver-relay`.
            Empty string if the relay did not return one — the field is
            always present so clients can index it without `Option` handling.
          example: 4GArqMi1WJwsw7p4tWHAbYG2Se5Wp6YSb8Ab3C8cUTJg
        delivered:
          description: |-
            Canonical identifier of the asset the recipient received on-chain.
            Format mirrors the request `token` field of
            `POST /wallet/v1/intents/withdraw`, so clients can compare request
            vs. response directly:

            - `"native_near"` — the wallet emitted a `native_withdraw` intent
              that unwrapped wNEAR and sent native NEAR. The recipient
              received native NEAR regardless of what the request `token`
              field named (`""`, `"near"`, or `"native"`).
            - `"nep141:<contract>"` — the wallet emitted a NEP-141 `transfer`
              intent. The recipient received that token, including wNEAR
              (`"nep141:wrap.near"`), USDC, USDT, etc.

            Never returned: the legacy short symbol `"wnear"` (was emitted
            in error by coordinator versions prior to the
            `WithdrawResult`-typed response — see api-spec CHANGELOG).
          oneOf:
            - type: string
              const: native_near
            - type: string
              pattern: '^nep141:.+'
              example: 'nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1'

    RequestListResponse:
      type: object
      required: [requests, total]
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/RequestStatusResponse'
        total:
          type: integer

    # ── Confidential intents ──────────────────────────────────────────────
    ConfidentialShieldRequest:
      description: SHIELD body — same shape as `IntentsDepositRequest`.
      allOf:
        - $ref: '#/components/schemas/IntentsDepositRequest'
    ConfidentialUnshieldRequest:
      description: UNSHIELD body — same shape as `IntentsDepositRequest`.
      allOf:
        - $ref: '#/components/schemas/IntentsDepositRequest'
    ConfidentialWithdrawRequest:
      description: >-
        Confidential withdraw body — same shape as `WithdrawRequest`; `token`
        is required (the source confidential asset to deliver). `chain` must be
        the token's home chain or `"near"` (mismatches are rejected).
        `chain="near"` delivers native NEAR for `nep141:wrap.near` (via
        `intents.near native_withdraw`) and the NEP-141 token on NEAR for omft
        bridge assets (use `confidentialUnshield` if you want to send to your
        own public balance instead).
      allOf:
        - $ref: '#/components/schemas/WithdrawRequest'
    ConfidentialSwapRequest:
      description: >-
        Confidential swap body — same shape as `SwapRequest`
        (`token_in` / `amount_in` / `token_out` / optional `min_amount_out`).
        On a multisig wallet the confidential swap binds `token_out` and
        `min_amount_out` into the approved op (like a public swap), so approvers
        commit to the output terms — a compromised coordinator cannot change them
        after approval.
      allOf:
        - $ref: '#/components/schemas/SwapRequest'
    ConfidentialDepositIntentRequest:
      description: >-
        Cross-chain deposit body — same shape as `DepositIntentRequest`
        (`source_asset` or `chain`+`token`). NOTE: for the confidential endpoint
        `destination_asset` and `refund_address` are **ignored** — the
        destination is forced to the origin asset (same-asset cross-chain deposit
        into the confidential shard) and refund is forced to the wallet's 64-hex
        intentsUserId (the `refundType=CONFIDENTIAL_INTENTS` invariant).
      allOf:
        - $ref: '#/components/schemas/DepositIntentRequest'
    ConfidentialDepositIntentResponse:
      description: Cross-chain deposit address — same shape as `DepositIntentResponse`.
      allOf:
        - $ref: '#/components/schemas/DepositIntentResponse'

    ConfidentialTransferRequest:
      type: object
      description: >-
        Private confidential→confidential transfer. No `chain` (NEAR-only
        context); `token` required (no native-asset concept inside the
        confidential shard).
      required: [to, amount, token]
      properties:
        to:
          type: string
          description: Recipient NEAR account id (intentsUserId / 64-hex implicit account).
        amount:
          type: string
          description: Amount in minimal units.
        token:
          type: string
          description: Defuse asset id, e.g. `nep141:wrap.near`.

    ConfidentialOpResponse:
      type: object
      description: |
        Result of a confidential shield / unshield / withdraw / transfer / swap.
        The op is asynchronous — the user's signed intent settles on the private
        shard (`intents.far`, no public RPC), so there is no public `tx_hash`;
        track via `intent_hash` / `deposit_address` and poll
        `GET /wallet/v1/requests/{id}`.

        Once the op is terminal, the request row's `result.swap_details`
        carries `intentHashes`, `nearTxHashes`, `originChainTxHashes` and
        `destinationChainTxHashes` — **all arrays of plain hash strings**,
        with 1Click-style **camelCase** inner keys (the `swap_details`
        container itself is snake_case). Upstream 1Click emits
        `{hash, explorerUrl}` objects; the coordinator normalizes them to
        plain strings, so this wire shape is stable regardless of upstream
        changes. Also present: settled amounts and refund fields
        (`amountIn`, `amountOut`, `refundedAmount`, `refundReason`, …). For
        an external-chain `confidentialWithdraw`, `destinationChainTxHashes`
        holds the actual delivery transaction on the destination chain; the
        arrays are empty until settlement and may stay empty for
        shard-internal ops (shield / unshield / transfer / swap).

        **Multisig:** the Trusted confidential ops (withdraw / transfer / swap)
        are subject to the wallet's approval policy. When approval is required the
        response inlines `approval_id` / `required` / `approved` / `request_hash`
        (same shape as `WithdrawResponse` / `SwapResponse`) — sign `request_hash`
        and submit your approval vote; the op executes after the threshold is met.
      required: [request_id, status]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
          description: >-
            Normalized lifecycle status (1Click's UPPERCASE state machine mapped
            to lowercase): `pending_deposit` → `processing` → `success` /
            `failed` / `refunded`. `pending_approval` is returned instead when a
            multisig wallet must approve the op first. The raw upstream status is
            in the request row's `result.oneclick_status`.
          enum: [pending_deposit, processing, success, failed, refunded, pending_approval]
        intent_hash:
          type: [string, 'null']
          description: Confidential-shard intent hash (never appears on the public chain).
        deposit_address:
          type: [string, 'null']
          description: Opaque 1Click hop address — the status primary key.
        approval_id:
          type: string
          format: uuid
          description: Present only on `pending_approval` (multisig) — the approval to vote on.
        required:
          type: integer
          description: Present only on `pending_approval` — approvals needed.
        approved:
          type: integer
          description: Present only on `pending_approval` — approvals collected so far (0 at creation).
        request_hash:
          type: string
          description: Present only on `pending_approval` — sha256(canonical_json(op)); sign this to approve.

    ConfidentialBalanceResponse:
      type: object
      description: A single confidential balance (response to `?token=`).
      required: [balance, token, account_id]
      properties:
        balance:
          type: string
          description: Minimal units; `"0"` if the wallet holds none of this asset.
        token:
          type: string
        account_id:
          type: string
          description: Wallet's 64-hex NEAR implicit account (intentsUserId).

    ConfidentialBalanceEntry:
      type: object
      required: [token, balance]
      properties:
        token:
          type: string
        balance:
          type: string

    ConfidentialBalancesResponse:
      type: object
      description: All confidential balances (response when `token` is omitted).
      required: [balances, account_id]
      properties:
        balances:
          type: array
          items:
            $ref: '#/components/schemas/ConfidentialBalanceEntry'
        account_id:
          type: string
