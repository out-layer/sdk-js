  # ============================================================================
  # Payment checks — agent-to-agent gasless payments via ephemeral intents keys
  # ============================================================================
  /wallet/v1/payment-check/create:
    post:
      tags: [Wallet]
      operationId: createPaymentCheck
      summary: Create a payment check (bearer-claimable transfer)
      description: |
        Creates a "payment check": the wallet's intents balance is moved to a
        fresh ephemeral intents account (gaslessly, via the solver relay), and
        the ephemeral account's private key is returned as `check_key`. Whoever
        holds `check_key` can `claimPaymentCheck` the funds; the creator can
        `reclaimPaymentCheck` them back. Fund the wallet's intents balance first
        via `intentsDeposit`.

        **Security model:** this is NOT gated by multisig. The keystore signs the
        transfer-to-ephemeral only when the wallet policy grants the default-DENY
        `payment_check` capability and the per-transaction amount is within the
        capability's per-token amount cap. `claimPaymentCheck` / `reclaimPaymentCheck`
        are signed by the ephemeral `check_key` itself (NEP-413), never by the
        keystore.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCheckCreateRequest'
            example:
              token: nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              amount: '1000000'
              memo: coffee
              expires_in: 86400
      responses:
        '200':
          description: Payment check created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCheckCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /wallet/v1/payment-check/batch-create:
    post:
      tags: [Wallet]
      operationId: batchCreatePaymentChecks
      summary: Create up to 10 payment checks in one call
      description: |
        Creates between 1 and 10 payment checks in a single request, each backed
        by its own ephemeral intents account. The wallet's intents balance must
        cover the sum per token across the batch.

        **Security model:** identical to `createPaymentCheck` — gated by the
        default-DENY `payment_check` capability and its per-transaction amount cap
        (NOT multisig); each check's claim/reclaim is signed by that check's
        ephemeral key, not the keystore.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCheckBatchCreateRequest'
            example:
              checks:
                - token: nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  amount: '1000000'
                  memo: invoice-1
                - token: nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  amount: '2000000'
      responses:
        '200':
          description: Payment checks created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCheckBatchCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /wallet/v1/payment-check/claim:
    post:
      tags: [Wallet]
      operationId: claimPaymentCheck
      summary: Claim a payment check
      description: |
        Claims the funds held by a payment check into the authenticated wallet's
        intents balance. Signed by the ephemeral `check_key` (NEP-413), so the
        caller need only hold the key. Omit `amount` for a full claim, or pass a
        partial amount (minimal units) to claim part and leave the remainder
        claimable. Expired or already-settled checks are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCheckClaimRequest'
            example:
              check_key: 9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a
      responses:
        '200':
          description: Claim settled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCheckClaimResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /wallet/v1/payment-check/reclaim:
    post:
      tags: [Wallet]
      operationId: reclaimPaymentCheck
      summary: Reclaim an unclaimed payment check
      description: |
        Returns the (remaining) funds of a payment check the wallet created back
        to the wallet's own intents balance — used to cancel/expire a check that
        was never claimed. Identified by `check_id` and scoped to the creating
        wallet. Signed by the ephemeral check key (re-derived inside the
        keystore), not the keystore's wallet key. Omit `amount` for a full
        reclaim or pass a partial amount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCheckReclaimRequest'
            example:
              check_id: 3a2b1c0d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
      responses:
        '200':
          description: Reclaim settled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCheckReclaimResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /wallet/v1/payment-check/status:
    get:
      tags: [Wallet]
      operationId: getPaymentCheckStatus
      summary: Get a payment check's status
      description: |
        Returns the full lifecycle state of a payment check the wallet created,
        identified by `check_id`. `status` is normalized to `expired` when an
        `unclaimed` check is past its `expires_at`.
      parameters:
        - name: check_id
          in: query
          required: true
          schema:
            type: string
          description: The `check_id` returned by `createPaymentCheck`.
      responses:
        '200':
          description: Payment check status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCheckStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /wallet/v1/payment-check/list:
    get:
      tags: [Wallet]
      operationId: listPaymentChecks
      summary: List the wallet's payment checks
      description: |
        Lists payment checks created by the authenticated wallet, most recent
        first. Optionally filter by `status` (including the virtual `expired`
        status: unclaimed checks past their `expires_at`).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: >-
            Optional status filter. Accepts stored statuses (`unclaimed`,
            `claimed`, `partially_claimed`, `reclaimed`, `partially_reclaimed`)
            plus the virtual `expired` (unclaimed + past expiry).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Max rows to return (server caps at 100). Defaults to 50.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Number of rows to skip for pagination.
      responses:
        '200':
          description: Payment checks (most recent first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCheckListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /wallet/v1/payment-check/peek:
    post:
      tags: [Wallet]
      operationId: peekPaymentCheck
      summary: Inspect a payment check by its key (without claiming)
      description: |
        Reads a payment check's on-chain balance and metadata using its
        `check_key`, without moving any funds. Use this before
        `claimPaymentCheck` to see what a key is worth. Returns the live
        on-chain `balance` of the ephemeral account plus the stored `token` /
        `memo` / `status` / `expires_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCheckPeekRequest'
            example:
              check_key: 9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a
      responses:
        '200':
          description: Payment check snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCheckPeekResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /wallet/v1/sign-message:
    post:
      tags: [Wallet]
      operationId: signMessage
      summary: Sign a generic NEP-413 message
      description: |
        Signs a NEP-413 message with the wallet's NEAR key (e.g. dApp login).
        Gated by the `sign_message` capability: `allowed_recipients` is a
        default-DENY allowlist of verifier recipients, and `intents.near` /
        `intents.far` are always excluded. Policy and freeze still apply — a
        frozen wallet cannot sign.

        **`format` is now NEP-413 only.** `format=raw` is **rejected** with
        `400 bad_request` — OutLayer NEAR-key auth (the old raw-ed25519
        `auth:`/`register:`/`api-key:` token) moved to
        [`POST /wallet/v1/auth-sign`](#tag/Wallet/operation/authSign), which
        builds the challenge with a fresh server timestamp. This is NOT OutLayer
        auth signing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignMessageRequest'
            example:
              message: 'login:myapp:1716200000'
              recipient: myapp.example
              format: nep413
      responses:
        '200':
          description: Signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /wallet/v1/auth-sign:
    post:
      tags: [Wallet]
      operationId: authSign
      summary: Sign an OutLayer NEAR-key auth challenge (Bearer / register / api-key)
      description: |
        Produces the OutLayer authentication signature used to construct a
        `Bearer near:` token, or to authenticate `POST /register` /
        `PUT /wallet/v1/api-key` from a deterministic wallet's own NEAR key.

        The keystore **builds** the exact challenge string
        `<prefix>:<seed>:<ts>` (where `prefix` is `auth` for `bearer`, else the
        purpose) with a **fresh server timestamp** and signs it raw ed25519. The
        client does NOT supply or control the timestamp — the fresh `ts` is what
        the coordinator's verifier requires. Send the returned `auth_message`
        verbatim.

        This is the replacement for the old
        `POST /wallet/v1/sign-message {format:"raw"}`. It maps to an always-allowed,
        non-fund `Op::Auth` (domain-separated from a tx hash) — no capability and
        no multisig gate it, but a frozen wallet still cannot sign.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSignRequest'
            examples:
              bearer:
                summary: Bearer-near auth token
                value:
                  purpose: bearer
                  seed: my-app-session
              register:
                summary: Authenticate POST /register
                value:
                  purpose: register
                  seed: my-app-session
              apiKey:
                summary: Authenticate PUT /api-key
                value:
                  purpose: api-key
                  seed: my-app-session
      responses:
        '200':
          description: Auth signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

